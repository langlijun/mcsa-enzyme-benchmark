name: Package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wheel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
          python -m pip check
      - name: Code-only tests (private fixture skips are explicit)
        run: python tools/run_tests.py
      - name: CLI and synthetic example
        run: |
          mcsa-benchmark list-cases
          mcsa-benchmark criteria --case 1L7N
          python examples/synthetic_axis.py
