[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcsa-enzyme-benchmark"
version = "0.7.0"
description = "Independent mechanism and general geometry evaluation of enzyme complexes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["gemmi==0.7.5", "numpy==2.3.5", "scipy==1.18.1", "rdkit==2026.3.6"]

[project.optional-dependencies]
dev = ["build>=1.2,<2"]

[project.scripts]
mcsa-benchmark = "mcsa_benchmark.cli:main"
mcsa-benchmark-panel = "mcsa_benchmark.panel:main"

[project.urls]
Repository = "https://github.com/langlijun/mcsa-enzyme-benchmark"
Issues = "https://github.com/langlijun/mcsa-enzyme-benchmark/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcsa_benchmark = ["data/*.json"]

